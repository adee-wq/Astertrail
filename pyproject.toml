[project]
name = "model-marte"
version = "0.1.0"
description = "VARnet-Marte"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.4",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "truststore>=0.10.5",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
