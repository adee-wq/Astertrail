<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astertrail · Temperatura de la misión</title>
<link rel="stylesheet" href="px-button.css">
<link rel="stylesheet" href="px-panel.css">
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    /* tu fondo de cabina: background-image: url('fondo.png'); */
    background: radial-gradient(ellipse at 50% 40%, #0b1a33 0%, var(--ast-abyss) 75%) fixed;
    background-size: cover;
    font-family: var(--px-font);
    color: var(--ast-sky);
  }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px 0; }
  main { width: min(1180px, 94vw); margin: 18px auto 40px; }
</style>
<script src="px-button.js" defer></script>
<script src="gp-chart.js" defer></script>
<script src="data/gp-data.js" defer></script>
</head>
<body>
  <div class="top">
    <button class="px-btn" data-size="sm" id="back">BACK</button>
    <span class="px-label" data-size="sm" data-color="#f26306">ASTERTRAIL · CAPA AMBIENTAL</span>
  </div>

  <main>
    <section class="px-panel">
      <div class="px-panel__head">
        <span class="px-label" data-size="md" data-color="#e8f4ff" id="title">TEMPERATURA DEL AIRE</span>
        <div class="px-panel__meta" id="meta"></div>
      </div>

      <div class="px-chart" id="chart" role="img" aria-label="Temperatura predicha por el GP durante la misión"></div>

      <div class="px-legend">
        <span class="px-legend__item"><span class="px-swatch px-swatch--line" style="background:#51b4f5"></span>
          <span class="px-label" data-size="xs" data-color="#9fc8ea">PREDICCIÓN GP</span></span>
        <span class="px-legend__item"><span class="px-swatch" style="background:rgba(34,118,192,.75)"></span>
          <span class="px-label" data-size="xs" data-color="#9fc8ea">±1σ</span></span>
        <span class="px-legend__item"><span class="px-swatch" style="background:rgba(81,180,245,.28)"></span>
          <span class="px-label" data-size="xs" data-color="#9fc8ea">±2σ (95 %)</span></span>
        <span class="px-legend__item" id="lg-hidden"><span class="px-swatch px-swatch--dot" style="background:#f26306"></span>
          <span class="px-label" data-size="xs" data-color="#9fc8ea">REMS REAL (OCULTO AL GP)</span></span>
        <span class="px-legend__item" id="lg-obs"><span class="px-swatch px-swatch--dot" style="background:#e8f4ff"></span>
          <span class="px-label" data-size="xs" data-color="#9fc8ea">REMS OBSERVADO</span></span>
      </div>
    </section>
  </main>

<script>
  window.addEventListener('DOMContentLoaded', async () => {
    let d = window.GP_DATA;
    if (!d) { try { d = await (await fetch('data/gp.json')).json(); } catch (e) {} }
    const box = document.getElementById('chart');
    const paint = () => {
      const r = GPChart.draw(box, d, { height: Math.max(320, Math.min(460, window.innerHeight * 0.55)) });
      if (!r) return;
      document.getElementById('lg-hidden').style.display = r.hidden ? '' : 'none';
      document.getElementById('lg-obs').style.display = r.obs ? '' : 'none';
    };
    if (d) {
      const m = d.mission, h = Math.floor(m.ltst_start), mi = Math.round((m.ltst_start - h) * 60);
      document.getElementById('meta').innerHTML =
        `Misión: sol ${m.sol} · ${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')} LTST · ${m.hours} h<br>` +
        `GP con ${d.meta.n_fit} puntos REMS · ajuste ${d.meta.fit_seconds} s` +
        (d.meta.mission_hidden ? ' · datos de la misión ocultos' : '');
    }
    paint();
    let tm; window.addEventListener('resize', () => { clearTimeout(tm); tm = setTimeout(paint, 120); });
  });
  document.getElementById('back').addEventListener('click', () => history.back());
</script>
</body>
</html>
