<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astertrail · prueba de teselas</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="px-button.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--ast-abyss); font-family: var(--px-font); }
  #map { position: absolute; inset: 0; background: #000; }
  .info { position: absolute; z-index: 1000; left: 12px; bottom: 44px; padding: 6px 10px;
          background: rgba(4,23,52,.85); color: #e8f4ff; font-size: 20px; border: 2px solid var(--ast-blue); }
  .info b { color: var(--ast-orange); font-weight: normal; }
  .leaflet-control-layers, .leaflet-control-attribution { font-family: var(--px-font); font-size: 16px; }
</style>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="layers.js"></script>
</head>
<body>
<div id="map"></div>
<div class="info" id="info"></div>
<script>
  const A = window.AST_LAYERS;
  const map = L.map('map', { crs: A.crs(L), center: A.CENTER, zoom: A.ZOOM, maxZoom: 19, minZoom: 3 });
  const b = A.bases(L);
  b['IMAGEN · HiRISE/CTX'].addTo(map);
  L.control.layers(b, null, { collapsed: false }).addTo(map);
  L.control.scale({ imperial: false }).addTo(map);
  map.attributionControl.setPrefix('Leaflet');
  const info = document.getElementById('info');
  const show = (ll) => info.innerHTML =
    `<b>${A.OFFLINE ? 'OFFLINE' : 'EN LÍNEA'}</b> · z${map.getZoom()} · ` +
    `${Math.abs(ll.lat).toFixed(5)}° ${ll.lat < 0 ? 'S' : 'N'}, ${ll.lng.toFixed(5)}° E`;
  map.on('mousemove', e => show(e.latlng));
  map.on('zoomend moveend', () => show(map.getCenter()));
  show(map.getCenter());
</script>
</body>
</html>
